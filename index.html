<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Lantern of Kaldra — A Choose-Your-Own-Adventure RPG</title>
  <meta name="description" content="A browser gamebook RPG: pick a class, make choices, and roll an animated d20 for checks." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>The Lantern of Kaldra</h1>
    <p class="tagline">A choose-your-own-adventure gamebook</p>
    <label class="language-control"><span data-i18n="Language">Language</span>
      <select id="language-select">
        <option value="en" lang="en">English</option>
        <option value="es" lang="es">Español</option>
      </select>
    </label>
  </header>

  <main id="app">
    <!-- Class selection screen -->
    <section id="screen-select" class="screen hidden">
      <div class="parchment intro">
        <h2 id="set-heading" data-i18n="Choose your trilogy">Choose your trilogy</h2>
        <select id="adventure-set" aria-labelledby="set-heading"></select>
        <p id="set-intro"></p>
        <ol id="set-stories"></ol>
        <p data-i18n="Choose who you will be, and turn the page.">Choose who you will be, and turn the page.</p>
        <label class="name-label"><span data-i18n="Your name:">Your name:</span> <input id="hero-name" maxlength="24" placeholder="Aldric" /></label>
      </div>
      <div id="class-list" class="class-list"></div>
    </section>

    <!-- Game screen -->
    <section id="screen-game" class="screen hidden">
      <aside class="sheet parchment" aria-label="Adventure Sheet">
        <h2 data-i18n="Adventure Sheet">Adventure Sheet</h2>
        <div id="sheet-body"></div>
        <div class="sheet-actions">
          <button id="btn-ability" class="btn small"></button>
          <button id="btn-potion" class="btn small">Drink Potion</button>
          <button id="btn-free-roll" class="btn small ghost" title="Roll a d20 just for fun" data-i18n="Roll a d20">Roll a d20</button>
          <button id="btn-restart" class="btn small ghost" data-i18n="New Adventure">New Adventure</button>
        </div>
      </aside>

      <article class="page parchment">
        <div class="section-number" id="section-number"></div>
        <h2 id="section-title"></h2>
        <figure id="section-illustration" class="story-illustration hidden">
          <img alt="" />
          <figcaption></figcaption>
        </figure>
        <div id="section-text" class="section-text"></div>
        <div id="section-interactive"></div>
        <div id="section-choices" class="choices"></div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </article>
    </section>
  </main>

  <!-- Dice overlay -->
  <div id="dice-overlay" class="dice-overlay hidden" aria-hidden="true">
    <canvas id="dice-canvas"></canvas>
    <div id="dice-result" class="dice-result hidden"></div>
  </div>

  <footer class="site-footer" data-i18n="An original adventure inspired by classic 1980s fantasy gamebooks.">
    An original adventure inspired by classic 1980s fantasy gamebooks.
  </footer>

  <script src="dice.js"></script>
  <script src="story.js"></script>
  <script src="story-es.js"></script>
  <script src="adventures.js"></script>
  <script src="i18n.js"></script>
  <script src="game.js"></script>
</body>
</html>
